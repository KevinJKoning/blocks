[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blocks"
version = "0.1.0"
description = "Apps as a graph of Python functions with UI blocks on top, run in the browser (Pyodide) and shipped as one offline HTML file."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=8", "playwright==1.64.0"]

[project.scripts]
blocks = "blocktool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blocktool = ["templates/*", "templates/app/*", "plugins/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: drives apps in headless Chromium (slower)"]
